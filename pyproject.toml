[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "max-mcp-codex"
version = "0.1.0"
description = "Codex-oriented MCP adapter for Autodesk 3ds Max"
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
  "mcp>=1.0.0,<2.0.0",
]

[project.scripts]
max-mcp-codex = "max_mcp_codex.server:main"

[tool.setuptools.packages.find]
where = ["src"]
